# Configuración de Alembic para NexaAgent.
# La URL de la base NO se pone aquí: el env.py la toma de app.core.config.settings
# y convierte +asyncpg -> +psycopg2 en memoria (Alembic corre síncrono).

[alembic]
script_location = alembic
prepend_sys_path = .
# Separador de rutas de prepend_sys_path (Alembic >= 1.16 avisa si falta).
path_separator = os
# sqlalchemy.url se inyecta en env.py — dejar vacío a propósito.
sqlalchemy.url =

[post_write_hooks]
# (sin hooks)

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
